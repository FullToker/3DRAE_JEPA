# ──────────────────────────────────────────────────────────────────────────────
# delex_v1: balnum_v1 + half of the training questions delexicalized
# ──────────────────────────────────────────────────────────────────────────────
#
# Why: besides the answer distribution, the object names themselves let a model
# answer from what rooms usually look like. With the names replaced by
# "object A", "object B", ... (jepa3d/delex.py) the only cue to which object is
# meant is its object token (the patches dino.txt chose for the name).
#
# Change (everything else is balnum_v1): data.delexicalize = 0.5, every training
# row is delexicalized with probability 0.5 at each draw (question, answer and
# wrong answers). The other half keeps the names, as the benchmarks do.
# Evaluation is run twice: with names, and with all rows delexicalized.
#
# Everything of this experiment lives in experiments/delex_v1/ on the server:
#   ckpt/  results/  logs/  notebooks/   (data: slots_v2's manifests, balnum_v1's weights and numeric manifests)
#
# Run: slots_train.sbatch with NAME=delex_v1 DATA=experiments/slots_v2/data DELEX_EVAL=1
#   and balnum_v1's NUMERIC / WEIGHTS
# ──────────────────────────────────────────────────────────────────────────────

init_vljepa_ckpt: ${VJEPA_ROOT}/ckpts/open_vljepa/best.pt

rae:
  feature_config: configs/models/dino2_feature.yaml   # relative to this repo
  max_views: 32

fusion:
  x_encoder_type: 3drae
  x_encoder_output_dim: 768

slots:
  enabled: true
  mode: tokens   # add (slots_v1) | tokens
  hidden: 512

numeric_head:
  enabled: true
  hidden: 512

model:
  query_model_name: meta-llama/Llama-3.2-1B
  predictor_llama_layers: 8
  max_query_tokens: 256
  y_encoder_name: google/embeddinggemma-300m
  max_target_tokens: 256
  shared_embed_dim: 1536
  y_encoder_lr_multiplier: 0.05
  hf_cache_dir: ${VJEPA_ROOT}/ckpts

data:
  train_manifests:
    - ${RAE_ROOT}/experiments/slots_v2/data/train_f8.jsonl
  val_manifests:
    - ${RAE_ROOT}/experiments/slots_v2/data/holdout_f8.jsonl   # shuffled, all rows have negatives
  answer_weights: ${RAE_ROOT}/experiments/balnum_v1/data/answer_weights.json   # jepa3d/balance.py
  delexicalize: 0.5   # share of training rows with object names replaced (jepa3d/delex.py)
  mask_key: answer_key   # InfoNCE: equal answer_key pairs are masked
  num_negatives: 3       # wrong answers per row in training (4-way choice); validation scores all
  image_size: [224, 308]    # (H, W), multiple of 14, ScanNet aspect, as 3DRAE's ScanNet examples
  num_workers: 8
  val_num_workers: 2
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2

train:
  seed: 42
  device: cuda
  precision: bf16
  output_dir: ${RAE_ROOT}/experiments/delex_v1/ckpt

  batch_size: 32
  gradient_accumulation_steps: 4
  # effective batch = 32 * 4 * 3 GPUs = 384. max_steps counts per-rank
  # micro-batches: 6870 * 32 * 3 = 660k samples = about 1 epoch of train_f8.jsonl
  # (658,518 rows)
  # = 1717 optimizer updates.
  max_steps: 6870
  hard_weight: 1.0
  slot_weight: 1.0   # InfoNCE on the output at the object tokens
  numeric_weight: 1.0   # smooth L1 on log(answer) of the numeric rows

  clip_grad_norm: 1.0
  log_every: 50
  save_every: 0      # final.pt only (~11 GB)
  val_every: 500
  val_max_batches: 60   # 1920 holdout rows
  val_batch_size: 32

  learning_rate: 1.0e-4
  min_lr: 1.0e-5
  warmup_steps: 200   # optimizer updates
  weight_decay: 0.01
  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_eps: 1.0e-8
  scheduler: cosine
  temperature: 0.07

mlflow:
  enabled: true
  env_file: ${VJEPA_ROOT}/.env/mlflow.env
  tracking_uri: "file:///glob/g01-cache/pf/Yushuo/mlruns"
  experiment_name: vljepa_sft_from_ckpt
  run_name: delex_v1
  log_params: true
  tags:
    project: vljepa-3drae
    variant: A-3drae-dino2-1024
    data: vsi590k-spar-f8-hardneg-slots-patch
