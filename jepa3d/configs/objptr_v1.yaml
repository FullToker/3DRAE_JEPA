# ──────────────────────────────────────────────────────────────────────────────
# objptr_v1: dinotxt_enc_v1 + one placeholder token per object name, which must point at the object
# ──────────────────────────────────────────────────────────────────────────────
#
# Why: no model so far uses the scene for the multiple-choice questions. Answering them takes
# several steps (find the named objects, take the stated viewpoint, compare) and the answer
# loss rewards only the last one, so the first is never learned. This run rewards the first
# step on its own.
#
# Change (jepa3d/pointer.py, jepa3d/model.py; slots.mode: pointer):
#   - every object name of the question gets a placeholder token, appended to the predictor's
#     input next to the name. It starts as the average of the scene tokens that dino.txt matches
#     to the name (softmax over the cosine of the name's text vector with the patch features),
#     plus the name's text vector through the patch projections, plus a type embedding;
#   - after predictor layers 2 and 4 (of 8) the hidden state at the placeholder is compared with
#     all scene tokens of the row and must choose a cell that shows the object: the cell holding
#     the projection of the object's true centre, in every view where the centre is in the image
#     and not hidden behind a nearer surface (depth test, jepa3d/tools/add_visibility.py). Each
#     layer has its own loss and its own linear readout, so the two can be compared;
#   - the answer is read from the mean over the question tokens and the placeholders; the
#     answer loss (InfoNCE + hard negatives) is unchanged.
# Labels: ground_v1's true object centres (EmbodiedScan boxes on ScanNet, centres rebuilt from
# SPAR's annotations on ScanNet++). Names without a label keep their placeholder, without a loss.
#
# Everything else is dinotxt_enc_v1 (dino.txt patches as scene tokens, hardneg_v1's schedule,
# losses and initial weights). Rows: the same as hardneg_v1's.
#
# Everything of this experiment lives in experiments/objptr_v1/ on the server.
# Run: objptr_data.sbatch, then slots_train.sbatch with NAME=objptr_v1
#   (MODE=baseline: the untrained choice; MODE=overfit; MODE=train)
# ──────────────────────────────────────────────────────────────────────────────

init_vljepa_ckpt: ${VJEPA_ROOT}/ckpts/open_vljepa/best.pt

rae:
  encoder: dinotxt   # jepa3d/x_encoder_dinotxt.py
  pool: 2            # patches averaged per side: 16 x 22 -> 8 x 11 tokens per view
  max_views: 32

slots:
  enabled: true
  mode: pointer     # jepa3d/pointer.py
  layers: [2, 4]    # predictor layers (of 8) after which the placeholder must point at its object

fusion:
  x_encoder_type: 3drae
  x_encoder_output_dim: 768

model:
  query_model_name: meta-llama/Llama-3.2-1B
  predictor_llama_layers: 8
  max_query_tokens: 256
  y_encoder_name: google/embeddinggemma-300m
  max_target_tokens: 256
  shared_embed_dim: 1536
  y_encoder_lr_multiplier: 0.05
  hf_cache_dir: ${VJEPA_ROOT}/ckpts

data:
  train_manifests:
    - ${RAE_ROOT}/experiments/objptr_v1/data/train_f8.jsonl
  val_manifests:
    - ${RAE_ROOT}/experiments/objptr_v1/data/holdout_f8.jsonl   # shuffled, all rows have negatives
  # true object centres of every scene; the rows' "ground" labels index into it
  ground_objects: ${RAE_ROOT}/experiments/objptr_v1/data/scene_objects.json
  mask_key: answer_key   # InfoNCE: equal answer_key pairs are masked
  num_negatives: 3       # wrong answers per row in training (4-way choice); validation scores all
  image_size: [224, 308]    # (H, W), multiple of 14, ScanNet aspect, as 3DRAE's ScanNet examples
  num_workers: 8
  val_num_workers: 2
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2

train:
  seed: 42
  device: cuda
  precision: bf16
  output_dir: ${RAE_ROOT}/experiments/objptr_v1/ckpt

  batch_size: 32
  gradient_accumulation_steps: 4
  # effective batch = 32 * 4 * 3 GPUs = 384. max_steps counts per-rank
  # micro-batches: 6870 * 32 * 3 = 660k samples = about 1 epoch of train_f8.jsonl
  # (658,518 rows)
  # = 1717 optimizer updates.
  max_steps: 6870
  hard_weight: 1.0
  pointer_weight: 1.0   # times the pointing loss, summed over the two layers

  clip_grad_norm: 1.0
  log_every: 50
  save_every: 0      # final.pt only (~14 GB)
  val_every: 500
  val_max_batches: 60   # 1920 holdout rows
  val_batch_size: 32

  learning_rate: 1.0e-4
  min_lr: 1.0e-5
  warmup_steps: 200   # optimizer updates
  weight_decay: 0.01
  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_eps: 1.0e-8
  scheduler: cosine
  temperature: 0.07

mlflow:
  enabled: true
  env_file: ${VJEPA_ROOT}/.env/mlflow.env
  tracking_uri: "file:///glob/g01-cache/pf/Yushuo/mlruns"
  experiment_name: vljepa_sft_from_ckpt
  run_name: objptr_v1
  log_params: true
  tags:
    project: vljepa-3drae
    variant: dinotxt-patches-704
    data: vsi590k-spar-f8-hardneg-ground-visible
