# Overfit / plumbing check for sft_3drae_mix_f8.yaml (same model and data, MLflow off).

init_vljepa_ckpt: ${VJEPA_ROOT}/ckpts/open_vljepa/best.pt

rae:
  feature_config: configs/models/dino2_feature.yaml   # relative to this repo
  max_views: 32

fusion:
  x_encoder_type: 3drae
  x_encoder_output_dim: 768

model:
  query_model_name: meta-llama/Llama-3.2-1B
  predictor_llama_layers: 8
  max_query_tokens: 256
  y_encoder_name: google/embeddinggemma-300m
  max_target_tokens: 256
  shared_embed_dim: 1536
  y_encoder_lr_multiplier: 0.05
  hf_cache_dir: ${VJEPA_ROOT}/ckpts

data:
  train_manifests:
    - ${RAE_ROOT}/data/mix_vsi_spar_train_f8.jsonl
  val_manifests:
    - ${RAE_ROOT}/data/spar_video_val_f8.jsonl
  mask_key: answer_key   # InfoNCE: equal answer_key pairs are masked
  image_size: [224, 308]    # (H, W), multiple of 14, ScanNet aspect, as 3DRAE's ScanNet examples
  num_workers: 8
  val_num_workers: 2
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2

train:
  seed: 42
  device: cuda
  precision: bf16
  output_dir: ${RAE_ROOT}/outputs/overfit_3drae_mix_f8

  batch_size: 32
  gradient_accumulation_steps: 4
  # effective batch = 32 * 4 * 3 GPUs = 384. GVJEPATrainer counts max_steps in
  # per-rank micro-batches: 7232 * 32 * 3 = 694k samples = 1 epoch of
  # data/mix_vsi_spar_train_f8.jsonl (694,280 rows).
  max_steps: 7232

  clip_grad_norm: 1.0
  log_every: 50
  save_every: 3000   # ~11 GB per checkpoint, /glob is 97% full
  val_every: 1000
  val_max_batches: 20
  val_batch_size: 32

  learning_rate: 1.0e-5
  min_lr: 1.0e-6
  weight_decay: 0.01
  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_eps: 1.0e-8
  scheduler: cosine
  temperature: 0.07

mlflow:
  enabled: false
  env_file: ${VJEPA_ROOT}/.env/mlflow.env
  tracking_uri: "file:///glob/g01-cache/pf/Yushuo/mlruns"
  experiment_name: vljepa_sft_from_ckpt
  run_name: overfit_3drae_mix_f8
  log_params: true
  tags:
    project: vljepa-3drae
    variant: A-3drae-dino2-1024
    data: vsi590k-spar-f8
