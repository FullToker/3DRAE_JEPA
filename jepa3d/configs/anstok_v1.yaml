# ──────────────────────────────────────────────────────────────────────────────
# anstok_v1: hardneg_v1 + an answer token for the short answer
# ──────────────────────────────────────────────────────────────────────────────
#
# Why: the answer sentence is encoded as the mean over its tokens. A right and a
# wrong answer to the same question differ in 3-8% of the tokens, so the two
# sentence vectors are almost the same (cosine 0.996-0.999 for direction and
# spatial_imagination rows); the differing tokens themselves are far apart
# (0.59-0.69). See experiments/flip_similarity_check. On the predictor side the
# prediction is likewise the mean over all question tokens.
#
# Change (jepa3d/answer.py, jepa3d/model.py, jepa3d/trainer.py):
#   - one more token after the question (end-of-text embedding + learned offset);
#   - mean over the question tokens -> pred_proj: the answer sentence, as in hardneg_v1;
#   - the answer token's output -> answer_proj: the answer in its short form
#     ("front-left", "radiator", "right, front", "3"), through the same Y-encoder;
#   - both parts: InfoNCE + hard_weight * cross-entropy against the same question's
#     wrong answers, equal weight (answer_weight 1.0).
# Evaluation: sentences by the first part, short answers and VSI-Bench's options by
# the answer token; each with real, shuffled and zero scene tokens.
# Data, schedule and warm start are those of hardneg_v1 (rows of slots_v2's manifests:
# the same rows, with the names' character spans, so the delexicalized evaluation runs).
#
# Everything of this experiment lives in experiments/anstok_v1/ on the server:
#   ckpt/  results/  logs/  notebooks/
#
# Run: NAME=anstok_v1 DATA=experiments/slots_v2/data with jepa3d/trainbatch/slots_train.sbatch
# ──────────────────────────────────────────────────────────────────────────────

init_vljepa_ckpt: ${VJEPA_ROOT}/ckpts/open_vljepa/best.pt

rae:
  feature_config: configs/models/dino2_feature.yaml   # relative to this repo
  max_views: 32

answer_token:
  enabled: true

fusion:
  x_encoder_type: 3drae
  x_encoder_output_dim: 768

model:
  query_model_name: meta-llama/Llama-3.2-1B
  predictor_llama_layers: 8
  max_query_tokens: 256
  y_encoder_name: google/embeddinggemma-300m
  max_target_tokens: 256
  shared_embed_dim: 1536
  y_encoder_lr_multiplier: 0.05
  hf_cache_dir: ${VJEPA_ROOT}/ckpts

data:
  train_manifests:
    - ${RAE_ROOT}/experiments/slots_v2/data/train_f8.jsonl
  val_manifests:
    - ${RAE_ROOT}/experiments/slots_v2/data/holdout_f8.jsonl   # shuffled, all rows have negatives
  mask_key: answer_key   # InfoNCE: equal answer_key pairs are masked
  num_negatives: 3       # wrong answers per row in training (4-way choice); validation scores all
  short_answers: true    # the short form of each answer and its wrong answers (jepa3d/answer.py)
  image_size: [224, 308]    # (H, W), multiple of 14, ScanNet aspect, as 3DRAE's ScanNet examples
  num_workers: 8
  val_num_workers: 2
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2

train:
  seed: 42
  device: cuda
  precision: bf16
  output_dir: ${RAE_ROOT}/experiments/anstok_v1/ckpt

  batch_size: 32
  gradient_accumulation_steps: 4
  # effective batch = 32 * 4 * 3 GPUs = 384. max_steps counts per-rank
  # micro-batches: 6870 * 32 * 3 = 660k samples = about 1 epoch of train_f8.jsonl
  # (about 95% of 694,280 rows; exact count in train_f8.jsonl.stats.json)
  # = 1717 optimizer updates.
  max_steps: 6870
  hard_weight: 1.0
  answer_weight: 1.0   # the answer token's two terms against the sentence's two terms

  clip_grad_norm: 1.0
  log_every: 50
  save_every: 0      # final.pt only (~11 GB)
  val_every: 500
  val_max_batches: 60   # 1920 holdout rows
  val_batch_size: 32

  learning_rate: 1.0e-4
  min_lr: 1.0e-5
  warmup_steps: 200   # optimizer updates
  weight_decay: 0.01
  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_eps: 1.0e-8
  scheduler: cosine
  temperature: 0.07

mlflow:
  enabled: true
  env_file: ${VJEPA_ROOT}/.env/mlflow.env
  tracking_uri: "file:///glob/g01-cache/pf/Yushuo/mlruns"
  experiment_name: vljepa_sft_from_ckpt
  run_name: anstok_v1
  log_params: true
  tags:
    project: vljepa-3drae
    variant: A-3drae-dino2-1024
    data: vsi590k-spar-f8-hardneg-short
