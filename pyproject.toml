[project]
name = "3drae"
version = "0.1.0"
description = "Official code for Any 3D Scene is Worth 1K Tokens"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy>=1.26,<2",
    "pillow==11.3.0",
    "plyfile==1.1.2",
    "pyyaml==6.0.2",
    "safetensors==0.6.2",
    "torch==2.6.0",
    "torchvision==0.21.0",
    "tqdm==4.67.1",
    "transformers==4.57.3",
    "viser==1.1.1",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/disc",
    "src/inference",
    "src/stage1",
    "src/stage2",
    "src/threedrae",
    "src/training",
    "src/utils",
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu124", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cu124", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
