model:
  target: stage1.RAE_Latent
  params:
    encoder_cls: Dinov2withNorm
    encoder_params:
      dinov2_path: checkpoints/backbones/dinov2-with-registers-base
      normalize: false
    neck_cls: LatentFuseNeck
    neck_params:
      latent_token_num: 1024
      hidden_size: 768
      patch_size: 14
      depth: 12
      num_heads: 16
      mlp_ratio: 4
      rope_freq: 100
      init_values: 0.01
      normalize: true
    decoder_img_cls: LatentImageDecoder
    decoder_img_params:
      hidden_size_input: 768
      hidden_size: 768
      patch_size: 14
      depth: 16
      num_heads: 16
      mlp_ratio: 4
      rope_freq: 100
      init_values: 0.01
    noise_tau: 0.8

dataset:
  path: data/scannet
  split: train
  repeat: 20
  patch_size: 14
  max_token_per_gpu: 25000
  max_batch_size: 12
  gan_max_token_per_gpu: 12500
  gan_max_batch_size: 8
  min_aspect_ratio: 0.7
  max_aspect_ratio: 1.8
  min_pixel_count: 37000
  max_pixel_count: 75500
  min_sample_len: 6
  max_sample_len: 18
  min_interval: 6
  max_interval: 25
  fix_interval_prob: 0.6
  mask_prob: 0.1
  min_mask_ratio: 0.1
  max_mask_ratio: 0.6
  all_mask_prob: 0.0
  novel_view_ratio: 1.0
  aug_focal: 0.9
  aug_crop: 16
  aug_color_jitter_prob: 0.8
  aug_color_jitter_brightness: 0.2
  aug_color_jitter_contrast: 0.2
  aug_color_jitter_saturation: 0.2
  aug_color_jitter_hue: 0.02
  aug_grayscale_prob: 0.0
  aug_gaussian_blur_prob: 0.02

training:
  max_steps: 120000
  checkpoint_interval: 1000
  vis_interval: 1000
  log_interval: 10
  clip_gradient: 1.0
  ema_decay: 0.9978
  num_workers: 12
  seed: 42
  optimizer:
    type: muon
    lr: 1.0e-4
    betas: [0.9, 0.95]
    weight_decay: 0.0
    adamw_param_names: [latent_tokens]
  scheduler:
    type: cosine
    warmup_steps: 8000
    decay_end_steps: 90000
    base_lr: 1.0e-4
    final_lr: 1.0e-5
    warmup_from_zero: true

perceptual:
  vgg_weights: checkpoints/perceptual/vgg16-397923af.pth
  lpips_weights: checkpoints/perceptual/vgg.pth

discriminator:
  architecture:
    weights: checkpoints/discriminator/dino_vit_small_patch8_224.pth
    kernel_size: 9
  augment:
    probability: 1.0
    cutout: 0.0
  optimizer:
    type: muon
    lr: 1.0e-4
    betas: [0.9, 0.95]
    weight_decay: 0.0
    adamw_param_names: []
  scheduler:
    type: cosine
    warmup_steps: 1000
    decay_end_steps: 90000
    base_lr: 1.0e-4
    final_lr: 1.0e-5
    warmup_from_zero: true

loss:
  discriminator: hinge
  generator: vanilla
  perceptual_weight: 1.0
  gan_weight: 0.75
  discriminator_start_step: 50000
  gan_start_step: 60000
  maximum_adaptive_weight: 10000.0
